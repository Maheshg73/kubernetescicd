name: Production EKS CI CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Set up Java JDK Development Environment
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Java Application Source Code
        run: mvn clean install -DskipTests

      - name: Secure Authentication to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Configure Advanced Docker Buildx Engine
        uses: docker/setup-buildx-action@v3

      - name: Compile and Transmit Production Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/reviewapp:${{ github.run_number }}

      - name: Establish Secure Tunnel to Amazon AWS Cloud
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Generate and Update Kubernetes EKS Cluster Context Kubeconfig
        run: aws eks update-kubeconfig --name cicd --region ap-south-1

      - name: Dynamically Update Image Tag and Deploy Configurations to EKS Cluster
        run: |
          sed -i "s|DOCKER_IMAGE_PLACEHOLDER|${{ secrets.DOCKER_USERNAME }}/reviewapp:${{ github.run_number }}|g" k8s-manifest.yaml
          kubectl apply -f k8s-manifest.yaml
